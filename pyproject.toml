[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = { text = "MIT" }
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0,<2.6.0",
    "triton>=3.0.0,<3.2.0",
    "transformers>=4.51.0,<5.0.0",
    "flash-attn",
    "xxhash",
]

[project.optional-dependencies]
openai = [
    "fastapi>=0.115.0",
    "openai>=1.0.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.30.0",
]

[project.urls]
Homepage="https://github.com/GeeeekExplorer/nano-vllm"

# flash-attn imports torch in its setup.py but doesn't declare it as a build
# dependency. uv builds wheels in an isolated env, so inject torch there.
# Pin to the runtime torch version to avoid an ABI mismatch (an unpinned torch
# resolves to the latest release, which would be compiled against, then fail at
# import time under the project's torch).
[tool.uv.extra-build-dependencies]
flash-attn = ["torch==2.5.1"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
